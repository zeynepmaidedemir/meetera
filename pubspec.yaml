name: meetera
description: MeetEra – Erasmus social companion app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.1.0
  google_sign_in: ^6.2.1

  # Maps & Location
  google_maps_flutter: ^2.6.0
  geocoding: ^2.2.0
  uuid: ^4.5.1

  # Calendar
  add_2_calendar: ^3.0.1

  # Utilities
  http: ^1.2.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  url_launcher: ^6.3.0

  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # Media
  image_picker: ^1.0.7

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  sign_in_with_apple: ^7.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/cities.json
    - assets/icon.png
